name: Auto Release

# 每次推送到 main：先做基本检查，再按提交信息自动决定版本号、打 tag、发 Release。
# 版本号唯一真相是仓库根目录的 VERSION 文件，由本工作流回写。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_bump:
        description: "强制递增类型（留空 = 按提交信息自动判断）"
        type: choice
        options: ["", "major", "minor", "patch"]
        required: false

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  check:
    name: 语法与配置检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 编译所有 Python 文件
        run: |
          python -m compileall -q analysis.py trackman_dashboard.py trackman_live.py \
            tps_club.py tps_norm.py version.py .github/scripts/bump_version.py

      - name: 校验示例配置是合法 JSON
        run: python -m json.tool ai_config.example.json > /dev/null

      - name: 确认 VERSION 格式
        run: python -c "import re,sys; s=open('VERSION').read().strip(); sys.exit(0 if re.fullmatch(r'\d+\.\d+\.\d+', s) else 1)"

  release:
    name: 自动版本号与发布
    needs: check
    runs-on: ubuntu-latest
    # 回写版本号的提交带 [skip ci]，避免自己触发自己
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      released: ${{ steps.commit.outputs.released }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 计算下一个版本号
        id: ver
        env:
          FORCE: ${{ inputs.force_bump }}
        run: |
          if [ -n "$FORCE" ]; then
            python .github/scripts/bump_version.py --write --github-output --force "$FORCE"
          else
            python .github/scripts/bump_version.py --write --github-output
          fi

      - name: 提交 VERSION
        id: commit
        if: steps.ver.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION

          # 首次发版时 VERSION 不变，此时没有可提交内容——不能直接 commit，
          # 否则 git 报 "nothing to commit" 并以 1 退出，把整个工作流带挂。
          if git diff --cached --quiet; then
            echo "VERSION 无变化，跳过提交（首次发版）"
          else
            git commit -m "chore(release): v${{ steps.ver.outputs.version }} [skip ci]"
            git push origin HEAD:main
          fi

          # 记下要打 tag 的提交，后面用 API 建 tag + Release
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: 生成 Release 说明
        if: steps.commit.outputs.released == 'true'
        run: |
          PREV=$(git describe --tags --abbrev=0 "${{ steps.commit.outputs.sha }}^" 2>/dev/null || echo "")
          # --invert-grep 把发版自己那条 chore(release) 剔掉，否则每个 Release 都会带上它
          {
            echo "## v${{ steps.ver.outputs.version }}"
            echo ""
            echo "递增类型：**${{ steps.ver.outputs.bump }}**"
            echo ""
            if [ -n "$PREV" ]; then
              echo "### 变更（自 $PREV）"
              git log "$PREV..${{ steps.commit.outputs.sha }}" --no-merges \
                --invert-grep --grep="^chore(release)" --pretty="- %s"
            else
              echo "### 首次发布"
              git log "${{ steps.commit.outputs.sha }}" --no-merges \
                --invert-grep --grep="^chore(release)" --pretty="- %s" | head -40
            fi
          } > RELEASE_NOTES.md

      # 用 API 一次搞定 tag + Release。
      # 之前是 git tag + git push，但 GitHub 偶发返回 "remote rejected ... (failed)"，
      # 而那时 VERSION 提交已经推上去了，结果版本号和 tag 脱节，还得手动补。
      # 走 API 就没有这个中间状态，失败会带明确错误码。
      - name: 创建 Release（自动打 tag）
        if: steps.commit.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/releases" \
            -f tag_name="v${{ steps.ver.outputs.version }}" \
            -f target_commitish="${{ steps.commit.outputs.sha }}" \
            -f name="v${{ steps.ver.outputs.version }}" \
            -F body=@RELEASE_NOTES.md \
            --jq '"已发布 " + .html_url'

      - name: 汇总
        run: |
          if [ "${{ steps.commit.outputs.released }}" = "true" ]; then
            echo "### 已发布 v${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 本次没有新提交，未发版" >> "$GITHUB_STEP_SUMMARY"
          fi
