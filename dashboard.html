<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrackMan Live 看板</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#111823; --panel2:#0d131c; --line:#1f2a38;
    --text:#e8eef5; --muted:#7d8b9e; --dim:#4d5a6b;
    --green:#3fb950; --orange:#f0883e; --blue:#58a6ff; --violet:#a371f7;
    --mono:'SF Mono',ui-monospace,Consolas,'Cascadia Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #14202e 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 0%, #10251c 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;
    padding:18px 20px 28px; min-height:100%;
  }
  .wrap{max-width:1360px;margin:0 auto}

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    padding:14px 20px;margin-bottom:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0));
    border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(6px);
  }
  .brand{display:flex;align-items:center;gap:11px;padding-right:20px;border-right:1px solid var(--line)}
  .dot{
    width:9px;height:9px;border-radius:50%;background:var(--dim);
    box-shadow:0 0 0 4px rgba(0,0,0,.3);flex:none;transition:.3s;
  }
  .dot.on{background:var(--green);box-shadow:0 0 12px var(--green),0 0 0 4px rgba(63,185,80,.14);animation:pulse 2.4s infinite}
  .dot.warn{background:var(--orange);box-shadow:0 0 12px var(--orange),0 0 0 4px rgba(240,136,62,.14);animation:pulse 1.1s infinite}
  @keyframes pulse{50%{opacity:.45}}
  .brand h1{font-size:15px;font-weight:650;letter-spacing:.3px}
  .brand h1 span{color:var(--green)}
  .ver{
    font:10px/1 var(--mono);letter-spacing:.3px;padding:4px 6px;border-radius:5px;
    color:var(--dim);border:1px solid var(--line);white-space:nowrap;
  }
  .ver.dev{color:#d29922;border-color:rgba(210,153,34,.32)}
  .st{display:flex;flex-direction:column;gap:2px;min-width:0}
  .st b{font-size:12px;font-weight:600;color:var(--text)}
  .st i{font-size:11px;color:var(--muted);font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpis{display:flex;gap:26px;margin-left:auto;flex-wrap:wrap}
  .kpi{text-align:right;min-width:70px}
  .kpi u{display:block;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim);text-decoration:none;margin-bottom:1px}
  .kpi b{font:600 20px/1.2 var(--mono);letter-spacing:-.4px}
  .tools{display:flex;gap:8px;align-items:center}
  select,button{
    background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;font-size:12px;font-family:inherit;cursor:pointer;
    transition:.15s;
  }
  select:hover,button:hover{border-color:#31415a;background:#152030}
  button.on{border-color:var(--green);color:var(--green)}

  /* ---------- layout ---------- */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:14px;margin-bottom:14px}
  .chartRow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
  .grid > .card, .chartRow > .card{margin-bottom:0}
  .card{
    background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));
    border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;inset:0 0 auto 0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
  }
  .card h2{
    font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);
    font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;
  }
  .card h2 em{font-style:normal;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:400}

  /* ---------- latest shot ---------- */
  .shothead{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .club{font-size:22px;font-weight:650;letter-spacing:-.3px}
  .badge{
    font:600 10px/1 var(--mono);letter-spacing:.6px;padding:4px 7px;border-radius:5px;
    background:rgba(88,166,255,.12);color:var(--blue);border:1px solid rgba(88,166,255,.25);
  }
  .badge.warn{background:rgba(240,136,62,.12);color:var(--orange);border-color:rgba(240,136,62,.28)}
  .meta{margin-left:auto;font:11px/1.4 var(--mono);color:var(--dim);text-align:right}
  /* ---------- 数据面板：照 TPS 原版做 4 列满宽格子 ---------- */
  .hero{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .m{
    background:linear-gradient(180deg,#181f28,#11161d);
    border:1px solid #262e3a;border-radius:9px;
    padding:9px 14px 8px;min-height:124px;
    display:flex;flex-direction:column;position:relative;overflow:hidden;
  }
  .m u{
    display:flex;align-items:baseline;gap:6px;
    font-size:15px;font-weight:700;letter-spacing:.4px;
    color:var(--orange);text-decoration:none;white-space:nowrap;
  }
  .m u em{
    font:500 9.5px/1 var(--mono);font-style:normal;letter-spacing:.5px;
    color:#5f6f82;margin-left:auto;
  }
  .m b{
    font:700 56px/1.02 var(--mono);letter-spacing:-2.8px;color:#fff;
    font-variant-numeric:tabular-nums;white-space:nowrap;
    display:block;margin:6px 0 4px;
  }
  .m.long b{font-size:40px;letter-spacing:-1.8px}
  .m .f{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;
    gap:6px;margin-top:auto;font-size:13px;color:#6d7d90;
    font-variant-numeric:tabular-nums;
  }
  .m .f em{font-style:normal;font-weight:700;color:#b7c5d4;font-size:12.5px;text-align:center}
  .m .f .dev{text-align:right}
  .m.pop b{color:#fff;text-shadow:0 0 24px rgba(255,255,255,.5)}

  /* TPS 归一化开关状态 */
  .normBadge{
    margin-left:auto;font:600 10.5px/1 var(--mono);letter-spacing:.5px;
    padding:4px 8px;border-radius:5px;text-transform:none;
    background:rgba(160,178,200,.14);color:#a9bacd;border:1px solid rgba(160,178,200,.25);
    cursor:help;white-space:nowrap;
  }
  .normBadge.on{background:rgba(240,136,62,.18);color:#ffa657;border-color:rgba(240,136,62,.45)}
  .normBadge.ok{background:rgba(63,185,80,.14);color:#56d364;border-color:rgba(63,185,80,.35)}
  .normBadge.soft{background:rgba(210,153,34,.12);color:#d29922;border-color:rgba(210,153,34,.35);
    border-style:dashed}
  .normNote{
    margin-top:9px;font-size:13.5px;line-height:1.6;color:#ffb37a;
    display:flex;gap:8px;align-items:flex-start;
  }
  .normNote b{color:#ffa657;font-weight:700}

  .empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;min-height:200px;color:var(--dim);font-size:13px;text-align:center;
  }
  .empty .ring{
    width:38px;height:38px;border-radius:50%;border:2px solid var(--line);
    border-top-color:var(--green);animation:spin 1.1s linear infinite;
  }
  .aiEmpty{font-size:19px;color:#dce6f2}
  .aiEmpty .subline{font-size:15px;color:#9fb0c4;margin-top:2px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- charts ---------- */
  .charts{display:grid;gap:14px}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .axis{font:10px var(--mono);fill:var(--dim)}
  .gridline{stroke:#182230;stroke-width:1}

  /* ---------- table ---------- */
  .tablecard{padding:16px 18px 8px}
  .scroll{max-height:320px;overflow:auto;margin:0 -6px;padding:0 6px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{
    position:sticky;top:0;z-index:2;background:#0f1620;
    font:600 10px/1 var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--dim);
    text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  thead th:nth-child(-n+3){text-align:left}
  tbody td{
    padding:7px 8px;text-align:right;font-family:var(--mono);font-size:12px;
    border-bottom:1px solid #131c26;color:#c3cedb;white-space:nowrap;
  }
  tbody td:nth-child(-n+3){text-align:left;font-family:inherit}
  tbody tr{transition:background .4s}
  tbody tr:hover{background:rgba(88,166,255,.055)}
  tbody tr.fresh{animation:flash 1.8s ease-out}
  @keyframes flash{
    0%{background:rgba(63,185,80,.18)}
    100%{background:transparent}
  }
  .cl{color:var(--text);font-weight:560}
  .num{color:var(--text)}
  .idx{color:var(--dim);font-size:11px}
  .tm{color:var(--dim);font-size:11px}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:rgba(88,166,255,.05)}
  tbody tr.sel td{background:rgba(88,166,255,.09)}
  tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--blue)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#233042;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- AI 教练分析 ---------- */
  .aicard{margin-bottom:14px;border-color:#243248}
  .aicard::after{
    content:'';position:absolute;inset:0 auto 0 0;width:3px;
    background:linear-gradient(180deg,var(--blue),var(--violet));
  }
  .aiTools{margin-left:auto;display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0}
  .aiTools select,.aiTools button{font-size:11px;padding:4px 8px}

  .aiSummary{
    font-size:24px;line-height:1.62;font-weight:600;letter-spacing:-.2px;color:#fff;
    padding:18px 22px;border-radius:12px;margin-bottom:14px;
    background:linear-gradient(100deg,rgba(88,166,255,.12),rgba(163,113,247,.07));
    border:1px solid rgba(88,166,255,.24);
  }
  /* 三段从上到下铺开，不再分栏 —— 练球时远看要够大够清楚 */
  .aiCols{display:flex;flex-direction:column;gap:12px}
  .aiCol{
    background:var(--panel2);border:1px solid #17202c;border-radius:12px;
    padding:16px 22px 14px;min-width:0;position:relative;overflow:hidden;
  }
  .aiCol::after{
    content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--c);
    opacity:.85;
  }
  .aiCol.find{--c:#56d364}
  .aiCol.prob{--c:#ffa657}
  .aiCol.fix{--c:#79c0ff}
  .aiCol h3{
    font-size:18px;letter-spacing:1.4px;font-weight:700;margin-bottom:13px;
    display:flex;align-items:center;gap:9px;color:var(--c);
  }
  .aiCol h3::before{content:'';width:9px;height:9px;border-radius:2px;background:currentColor;flex:none}
  .aiItem{padding:12px 0;border-top:1px dashed rgba(255,255,255,.07)}
  .aiItem:first-of-type{border-top:0;padding-top:0}
  .aiItem b{
    display:block;font-size:22px;font-weight:650;margin-bottom:6px;line-height:1.4;
    color:#fff;
  }
  .aiItem p{font-size:18px;line-height:1.72;color:#f2f6fa;max-width:1180px}
  .aiItem .ev{
    display:inline-block;margin-top:7px;font:13px/1.5 var(--mono);color:#c2d2e4;
    background:rgba(255,255,255,.08);padding:3px 9px;border-radius:5px;
  }
  .sev{
    font:700 12px/1 var(--mono);padding:3px 7px;border-radius:4px;
    margin-right:8px;vertical-align:2px;
  }
  .sev.high{background:rgba(240,136,62,.25);color:#ffa76b}
  .sev.mid{background:rgba(88,166,255,.2);color:#79c0ff}
  .sev.low{background:rgba(160,178,200,.2);color:#cfdceb}
  .aiDrill{
    background:rgba(88,166,255,.055);border:1px solid rgba(88,166,255,.15);
    border-radius:10px;padding:14px 16px;
  }
  .aiDrill + .aiDrill{margin-top:10px}
  .aiDrill b{display:block;font-size:22px;font-weight:650;color:#fff}
  .aiDrill .why{font-size:17px;color:#79c0ff;font-weight:600;margin:4px 0 8px}
  .aiDrill .how{font-size:18px;line-height:1.72;color:#f2f6fa;max-width:1180px}
  .aiFoot{
    margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
    font-size:11px;color:#8fa1b6;display:flex;justify-content:space-between;
    align-items:center;gap:10px;flex-wrap:wrap;
  }
  .aiFoot .src{
    font:600 9.5px/1 var(--mono);letter-spacing:.5px;padding:3px 7px;border-radius:4px;
  }
  .src.ai{background:rgba(163,113,247,.2);color:#c4a2ff}
  .src.rules{background:rgba(160,178,200,.16);color:#cfdceb}
  .src.err{background:rgba(240,136,62,.2);color:#ffa76b}

  .aiWait{display:flex;align-items:center;gap:14px;padding:30px 2px;color:#dce6f2;font-size:18px}
  .aiWait .spin{
    width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;
    border-top-color:var(--violet);animation:spin 1s linear infinite;
  }
  .aiWait small{display:block;color:#9fb0c4;font-size:14px;margin-top:4px}

  /* ---------- 设置弹窗 ---------- */
  .modal{position:fixed;inset:0;background:rgba(4,7,11,.74);z-index:60;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  .modal[hidden]{display:none}
  .modal .box{
    width:min(480px,92vw);background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:22px 24px;box-shadow:0 24px 70px rgba(0,0,0,.6);
  }
  .modal h3{font-size:15px;margin-bottom:4px}
  .modal .sub2{font-size:11.5px;color:var(--dim);line-height:1.6;margin-bottom:6px}
  .modal label{display:block;font-size:11px;color:var(--muted);margin:14px 0 5px;letter-spacing:.4px}
  .modal input{
    width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:8px 10px;font-size:12.5px;font-family:var(--mono);
  }
  .modal input:focus{outline:none;border-color:#31415a}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;align-items:center}
  .modal .testMsg{margin-right:auto;font-size:11.5px;color:var(--dim);line-height:1.5}
  .modal button{padding:7px 14px;font-size:12px}
  .modal button.primary{background:rgba(88,166,255,.14);border-color:rgba(88,166,255,.4);color:var(--blue)}

  @media (max-width:1180px){
    .m b{font-size:44px;letter-spacing:-2.2px}
    .m.long b{font-size:33px}
    .m{min-height:108px;padding:8px 11px 7px}
    .m u{font-size:13.5px}
    .m u em{display:none}
  }
  @media (max-width:1080px){
    .grid{grid-template-columns:1fr}
    .kpis{gap:18px}
    .chartRow{grid-template-columns:1fr}
    .aiSummary{font-size:19px}
    .aiItem b,.aiDrill b{font-size:18px}
    .aiItem p,.aiDrill .how{font-size:16px}
  }
  @media (max-width:820px){
    .hero{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="dot" id="dot"></div>
      <h1>TrackMan <span>Live</span></h1>
      <span class="ver" id="verBadge" title="当前运行的版本"></span>
    </div>
    <div class="st">
      <b id="statTitle">正在连接…</b>
      <i id="statSub">ws://localhost:21581/ws</i>
    </div>
    <div class="kpis">
      <div class="kpi"><u>总杆数</u><b id="kCount">0</b></div>
      <div class="kpi"><u>最快球速</u><b id="kMax">—</b></div>
      <div class="kpi"><u>平均落点</u><b id="kAvg">—</b></div>
      <div class="tools">
        <select id="clubFilter"><option value="">全部球杆</option></select>
        <button id="unitBtn" title="切换单位">英制</button>
      </div>
    </div>
  </header>

  <!-- 最新一杆：全宽 4 列大字面板，对齐 TPS 原版 -->
  <section class="card">
    <h2>最新一杆 <em id="latestHint"></em>
      <span id="normBadge" class="normBadge" title="TPS 的 Normalize 开关状态"></span>
    </h2>
    <div id="latestBody">
      <div class="empty">
        <div class="ring"></div>
        <div>等待第一杆…</div>
        <div style="font-size:11px;color:var(--dim)">击球后自动出现，无需刷新</div>
      </div>
    </div>
  </section>

  <!-- 图表 -->
  <div class="chartRow">
    <section class="card">
      <h2>球速趋势 <em>最近 24 杆</em></h2>
      <svg id="trend" viewBox="0 0 520 170" preserveAspectRatio="xMidYMid meet"></svg>
    </section>
    <section class="card">
      <h2>落点分布 <em>横轴侧旋 / 纵轴落点</em></h2>
      <svg id="scatter" viewBox="0 0 520 200" preserveAspectRatio="xMidYMid meet"></svg>
    </section>
  </div>

  <!-- AI 教练分析 -->
  <section class="card aicard">
    <h2>AI 教练分析
      <em id="aiHint">每杆算完自动分析</em>
      <div class="aiTools">
        <select id="aiClub" title="默认自动：以 TPS 里选的球杆为准；手动改只影响当前这一杆"></select>
        <button id="aiRedo" title="用当前球杆重新分析这一杆">重新分析</button>
        <button id="aiCfgBtn" title="配置大模型">AI 设置</button>
      </div>
    </h2>
    <div id="aiBody"></div>
  </section>

  <!-- 历史 -->
  <section class="card tablecard">
    <h2>击球历史 <em id="histHint"></em></h2>
    <div class="scroll" id="scrollBox">
      <table>
        <thead>
          <tr>
            <th>#</th><th>时间</th><th>球杆</th>
            <th>球速</th><th>杆头</th><th>效率</th><th>发射角</th>
            <th>后旋</th><th>侧旋</th><th>落点</th><th>总距</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

</div>

<!-- AI 设置弹窗 -->
<div class="modal" id="aiModal" hidden>
  <div class="box">
    <h3>AI 设置</h3>
    <p class="sub2">填任意 OpenAI 兼容接口即可（DeepSeek、Kimi、通义、OpenAI、本地 Ollama 都行）。
      Key 只存在本机 <code>ai_config.json</code>，不会上传到任何第三方。</p>
    <label>接口地址</label>
    <input id="cfgUrl" placeholder="https://api.deepseek.com/v1">
    <label>模型名</label>
    <input id="cfgModel" placeholder="deepseek-flash">
    <label>API Key</label>
    <input id="cfgKey" type="password" placeholder="sk-…（留空表示不修改）">
    <div class="row">
      <span class="testMsg" id="cfgMsg"></span>
      <button id="cfgTest">测试</button>
      <button id="cfgCancel">取消</button>
      <button id="cfgSave" class="primary">保存</button>
    </div>
  </div>
</div>

<script>
/* ============ 状态 ============ */
let shots = [];
let filterClub = '';
let metric = localStorage.getItem('tm-unit') === 'metric';
let freshSeq = -1;
let freshKey = null;               // 上次播放"新杆"动画的 seq

/* ---- AI ---- */
let analyses = {};                 // seq -> 分析结果
let aiSeq = 0;                     // 当前显示哪一杆的分析
let aiInfo = { configured: false, use_ai: true, model: '' };
let aiClubs = [];
let pendingShot = null;            // 设备正在计算的杆
// 手动指定球杆只作用于"当前这一杆"，不跨杆记忆：
// 之前把选择存进 localStorage，结果打 56° 时页面还按上次的 L杆 去分析，球杆就"认错"了。
let clubOverride = '';
let normState = null;          // TPS Normalize 开关：{on, method, conf, layout, detail, stale}

const $ = id => document.getElementById(id);
const U = () => metric
  ? {speed:'km/h', dist:'m', height:'m', sk:1.60934, dk:0.9144, hk:0.3048, tag:'公制'}
  : {speed:'mph',  dist:'yd', height:'ft', sk:1,       dk:1,      hk:1,     tag:'英制'};

const num = (v, d=1) => (typeof v === 'number' && isFinite(v)) ? v.toFixed(d) : '—';
const spd = v => num(v * U().sk, 1);
const dst = v => num(v * U().dk, 1);
const hgt = v => num(v * U().hk, 1);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============ 数据面板：24 格，顺序照搬 TPS 原版 ============ */
const PANEL = [
  ['杆头速度',  'CLUB SPEED',   'clubSpeed',    'spd'],
  ['杆面/轨迹差','FACE TO PATH', 'faceToPath',   'deg'],
  ['挥杆方向',  'SWING DIR.',   'swingDir',     'deg'],
  ['杆面角',    'FACE ANG.',    'faceAngle',    'deg'],

  ['杆头轨迹',  'CLUB PATH',    'clubPath',     'deg'],
  ['攻击角',    'ATTACK ANG.',  'attack',       'deg'],
  ['落点',      'CARRY',        'carry',        'dst'],
  ['总距离',    'TOTAL',        'total',        'dst'],

  ['发射角',    'LAUNCH ANG.',  'launch',       'deg'],
  ['侧向',      'SIDE',         'side',         'side'],
  ['球速',      'BALL SPEED',   'ballSpeed',    'spd'],
  ['旋转轴',    'SPIN AXIS',    'spinAxis',     'deg'],

  ['效率',      'SMASH FAC.',   'smash',        'ratio'],
  ['后旋',      'SPIN RATE',    'spin',         'rpm'],
  ['最大高度',  'HEIGHT',       'height',       'hgt'],
  ['最低点距离','LOW PT DIST.', 'lowPoint',     'lowpt'],

  ['击球点偏移','IMP. OFFSET',  'impactOffset', 'mm'],
  ['击球点高度','IMP. HEIGHT',  'impactHeight', 'mmup'],
  ['动态杆面角','DYN. LOFT',    'loft',         'deg'],
  ['曲线',      'CURVE',        'curve',        'curve'],

  ['滞空',      'HANG TIME',    'hang',         'sec'],
  ['落地角',    'LANDING ANG.', 'landing',      'deg'],
  ['旋转杆面角','SPIN LOFT',    'spinLoft',     'deg'],
  ['动态杆底角','DYN. LIE',     'lie',          'deg'],
];

// 后端已统一成英制基础单位（mph / yd / ft / mm），这里只做显示口径切换
function conv(kind, v){
  const u = U();
  switch (kind){
    case 'spd':   return {n: v * u.sk, unit: u.speed, dec: 1};
    case 'deg':   return {n: v, unit: '°', dec: 1};
    case 'dst':   return {n: v * u.dk, unit: u.dist, dec: 1};
    case 'hgt':   return {n: v * u.hk, unit: u.height, dec: 1};
    case 'rpm':   return {n: v, unit: 'rpm', dec: 0};
    case 'ratio': return {n: v, unit: '', dec: 2};
    case 'sec':   return {n: v, unit: 's', dec: 2};
    case 'mm':    return {n: v, unit: 'mm', dec: 1};
    case 'mmup':  return {n: v, unit: 'mm', dec: 1};
    case 'lowpt': return metric ? {n: v * 30.48, unit: 'cm', dec: 1} : {n: v * 12, unit: 'in', dec: 1};
    case 'curve': return metric ? {n: v * u.dk, unit: 'm', dec: 0}  : {n: v * 3, unit: 'ft', dec: 0};
    case 'side':  return metric ? {n: v * u.dk, unit: 'm', dec: 1}  : {n: v * 3, unit: 'ft', dec: 1};
    default:      return {n: v, unit: '', dec: 1};
  }
}
const oknum = v => typeof v === 'number' && isFinite(v);

// 大字号格子里那一行数值：带方向的按 TPS 写法（9'6"L / 26L / 1.7A / 3.1U）
function bigVal(kind, v){
  if (!oknum(v)) return {txt: '—', unit: ''};
  const r = conv(kind, v);
  if (kind === 'side'){
    if (metric) return {txt: Math.abs(r.n).toFixed(1) + (r.n < 0 ? 'L' : 'R'), unit: r.unit};
    const a = Math.abs(r.n);
    let f = Math.floor(a), i = Math.round((a - f) * 12);
    if (i === 12){ f += 1; i = 0; }
    return {txt: `${f}' ${i}"${r.n < 0 ? 'L' : 'R'}`, unit: ''};
  }
  if (kind === 'curve') return {txt: Math.abs(r.n).toFixed(0) + (r.n < 0 ? 'L' : 'R'), unit: r.unit};
  if (kind === 'lowpt') return {txt: Math.abs(r.n).toFixed(1) + (r.n >= 0 ? 'A' : 'B'), unit: r.unit};
  // 击球点：官方口径 Impact Offset 正=趾部(toe)、负=跟部(heel)；Impact Height 正=向上
  if (kind === 'mm')    return {txt: Math.abs(r.n).toFixed(1) + (r.n < 0 ? 'H' : 'T'), unit: r.unit};
  if (kind === 'mmup')  return {txt: Math.abs(r.n).toFixed(1) + (r.n >= 0 ? 'U' : 'D'), unit: r.unit};
  return {txt: r.n.toFixed(r.dec), unit: r.unit};
}

// 底部小字：同球杆历史均值 / ±标准差（TPS 原版就是这三段）
function statOf(key, club){
  const grab = f => shots.filter(f).map(s => s.m[key]).filter(oknum);
  let v = grab(s => clubOf(s.m) === club);
  if (v.length < 2 && club) v = grab(() => true);
  if (v.length < 2) return null;
  const mean = v.reduce((a, b) => a + b, 0) / v.length;
  const sd = Math.sqrt(v.reduce((a, b) => a + (b - mean) * (b - mean), 0) / v.length);
  return {mean, sd};
}
function smallVal(kind, v){
  if (!oknum(v)) return '—';
  const r = conv(kind, v);
  return Math.abs(r.n).toFixed(r.dec);
}

/* ---- 球杆：后端从 TPS 本地库按 MeasurementId 查到，带 clubZh/clubShort ---- */
const clubOf = m => m.clubZh || m.club || '';
const clubLabel = m => clubOf(m) || '未识别球杆';
function clubBadge(r){
  const m = r.m || {};
  const out = [];
  const short = m.clubShort || '';
  if (short && short !== m.clubZh) out.push(short);       // "8i"
  if (r.club_src === 'guess') out.push('按球速推测');
  return out.map(t => `<span class="badge${t === '按球速推测' ? ' warn' : ''}">${esc(t)}</span>`).join('');
}

/* ============ 筛选 ============ */
function pool(){
  return filterClub ? shots.filter(s => (clubOf(s.m) || '未知') === filterClub) : shots;
}

/* ============ 顶部状态 ============ */
function paintStatus(st){
  const dot = $('dot');
  const title = $('statTitle'), sub = $('statSub');
  if (!st){
    dot.className = 'dot';
    title.textContent = '未连接';
    return;
  }
  if (st.measuring){ dot.className = 'dot warn'; }
  else if (st.tps){ dot.className = 'dot on'; }
  else { dot.className = 'dot'; }

  title.textContent = st.measuring ? '测量中…'
                   : st.tps ? '已连接 TPS' : '未连接 TPS';
  sub.textContent = st.message || '';
}

/* ============ 统计 ============ */
function paintKpis(){
  const s = pool();
  $('kCount').textContent = s.length;
  const bs = s.map(x => x.m.ballSpeed).filter(v => typeof v === 'number');
  $('kMax').textContent = bs.length ? spd(Math.max(...bs)) + ' ' + U().speed : '—';
  const cr = s.map(x => x.m.carry).filter(v => typeof v === 'number');
  $('kAvg').textContent = cr.length
    ? dst(cr.reduce((a,b)=>a+b,0)/cr.length) + ' ' + U().dist : '—';
}

/* ============ 最新一杆 ============ */
/* ---- TPS Normalize 开关：开着的时候它的距离是归一化值，和我们的实测值不是一套口径 ---- */
const NORM_TEXT = {
  on:  ['TPS 归一化中', 'on',
        'TPS 的 Normalize 已开启：它显示的距离是归一化到标准大气条件后的值。本看板显示的是设备推送的实测原始值，两者通常差 3~5%。'],
  off: ['实测（Normalize 关）', 'ok',
        'TPS 的 Normalize 是关闭的，两边都是实测值，可以直接对比。'],
  soft: ['Normalize 待确认', 'soft',
        '这个状态是从 TPS 的 layout 文件读的，而 layout 只在保存布局时才写盘，' +
        '运行中切换开关不会立刻反映，所以只能当参考。看板上开着 TPS 到击球分析界面就能实时读按钮状态了。'],
  unknown: ['Normalize 未识别', '',
        '读不到 TPS 的 Normalize 状态（窗口不在击球分析界面，或 TPS 没运行时更常见）。此时不清楚两边距离口径是否一致。'],
};
function normKey(){
  if (!normState || normState.on === null || normState.on === undefined) return 'unknown';
  if (normState.conf === 'low') return 'soft';       // layout 推测，不能当实测
  return normState.on ? 'on' : 'off';
}
/* ---- 版本号：dev 后缀说明跑的不是发版代码 ---- */
function paintVer(build){
  const el = $('verBadge');
  if (!el || !build || !build.version) return;
  el.textContent = 'v' + build.version.replace(/-dirty$/, '·dirty');
  el.className = 'ver' + (build.version.includes('-dev') || build.dirty ? ' dev' : '');
  const bits = [];
  if (build.commit) bits.push('提交 ' + build.commit);
  if (build.dirty) bits.push('工作区有未提交改动');
  if (build.version.includes('-dev')) bits.push('开发版，未发版');
  el.title = '版本 ' + build.version + (bits.length ? '\n' + bits.join('\n') : '');
}

function paintNorm(){
  const el = $('normBadge');
  if (!el) return;
  const [txt, cls, tip] = NORM_TEXT[normKey()];
  el.textContent = txt;
  el.className = 'normBadge' + (cls ? ' ' + cls : '');
  el.title = tip + (normState && normState.detail ? '\n检测：' + normState.detail : '');
}

function normNoteHTML(){
  if (normKey() !== 'on') return '';
  return `<div class="normNote"><span>⚠</span><span>TPS 开着 <b>Normalize</b>：它上面显示的距离是归一化值，
    这里显示的是设备<b>实测原始值</b>，两者通常差 3~5%，不是算错了。</span></div>`;
}

function panelCells(m){
  const club = clubOf(m);
  return PANEL.map(([zh, en, key, kind]) => {
    const big = bigVal(kind, m[key]);
    const st = statOf(key, club);
    const mean = st ? smallVal(kind, st.mean) : '—';
    const dev = '±' + (st ? smallVal(kind, st.sd) : '—');
    const long = big.txt.length > 5 ? ' long' : '';
    return `<div class="m${long}"><u>${esc(zh)}<em>${esc(en)}</em></u>` +
      `<b>${esc(big.txt)}</b>` +
      `<div class="f"><span>${mean}</span><em>${esc(big.unit || '')}</em><span class="dev">${dev}</span></div></div>`;
  }).join('');
}

function paintLatest(){
  const s = pool();
  const box = $('latestBody');
  if (!s.length){
    box.innerHTML = `<div class="empty">
        <div class="ring"></div><div>等待第一杆…</div>
        <div style="font-size:11px;color:var(--dim)">击球后自动出现，无需刷新</div>
      </div>`;
    return;
  }
  const r = s[s.length - 1], m = r.m;
  const t = new Date(r.ts);
  const hh = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0')
           + ':' + String(t.getSeconds()).padStart(2,'0');
  $('latestHint').textContent = '#' + r.seq + ' · ' + hh;

  box.innerHTML = `
    <div class="shothead">
      <span class="club">${esc(clubLabel(m))}</span>
      ${clubBadge(m)}
      ${m.player ? `<span class="badge">${esc(m.player)}</span>` : ''}
      ${r.kind ? `<span class="badge" style="background:rgba(163,113,247,.12);color:var(--violet);border-color:rgba(163,113,247,.25)">${esc(r.kind)}</span>` : ''}
      <span class="meta">第 ${r.seq} 杆 · ${hh}</span>
    </div>
    <div class="hero">${panelCells(m)}</div>${normNoteHTML()}`;

  // 只在换成新的一杆时闪一下；球杆补到同一杆时静默更新，不重播动画
  if (freshKey !== r.seq){
    freshKey = r.seq;
    document.querySelectorAll('.hero .m').forEach(el => {
      el.classList.add('pop');
      setTimeout(() => el.classList.remove('pop'), 420);
    });
  }
}

/* ============ 图表：球速趋势 ============ */
function paintTrend(){
  const svg = $('trend');
  const data = pool().slice(-24).filter(r => typeof r.m.ballSpeed === 'number');
  if (!data.length){
    svg.innerHTML = `<text class="axis" x="260" y="88" text-anchor="middle">等待击球数据…</text>`;
    return;
  }

  const W = 520, H = 170, L = 44, R = 14, T = 16, B = 26;
  const iw = W - L - R, ih = H - T - B;
  const vals = data.map(r => r.m.ballSpeed * U().sk);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max((hi - lo) * 0.25, 2);
  lo = Math.max(0, lo - pad); hi = hi + pad;

  const x = i => L + (data.length === 1 ? iw / 2 : (i / (data.length - 1)) * iw);
  const y = v => T + ih - ((v - lo) / (hi - lo)) * ih;

  let g = '';
  for (let k = 0; k <= 3; k++){
    const v = lo + (hi - lo) * k / 3, yy = y(v);
    g += `<line class="gridline" x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}"/>`;
    g += `<text class="axis" x="${L-7}" y="${(yy+3.5).toFixed(1)}" text-anchor="end">${v.toFixed(0)}</text>`;
  }

  const pts = data.map((r, i) => [x(i), y(r.m.ballSpeed * U().sk)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)} ${T+ih} L${pts[0][0].toFixed(1)} ${T+ih} Z`;

  const dots = data.map((r, i) => {
    const [cx, cy] = pts[i], last = i === data.length - 1;
    return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${last?4.5:2.8}"
              fill="${last?'#3fb950':'#2b6f43'}" stroke="${last?'#0a0e14':'none'}" stroke-width="2"/>`;
  }).join('');

  svg.innerHTML = `
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fb950" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient></defs>
    ${g}
    <path d="${area}" fill="url(#g1)"/>
    <path d="${line}" fill="none" stroke="#3fb950" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text class="axis" x="${L}" y="${H-6}">#${data[0].seq}</text>
    <text class="axis" x="${W-R}" y="${H-6}" text-anchor="end">#${data[data.length-1].seq}</text>`;
}

/* ============ 图表：落点分布 ============ */
function paintScatter(){
  const svg = $('scatter');
  const data = pool().filter(r =>
    typeof r.m.carry === 'number' && typeof r.m.spinAxis === 'number');
  if (!data.length){
    svg.innerHTML = `<text class="axis" x="260" y="100" text-anchor="middle">等待足够的数据（需落点 + 侧旋）…</text>`;
    return;
  }

  const W = 520, H = 200, L = 44, R = 14, T = 14, B = 26;
  const iw = W - L - R, ih = H - T - B;

  const sv = data.map(r => r.m.spinAxis);
  const dv = data.map(r => r.m.carry);
  const smax = Math.max(6, Math.ceil(Math.max(...sv.map(Math.abs))) + 2);
  let dlo = Math.min(...dv), dhi = Math.max(...dv);
  const dp = Math.max((dhi - dlo) * 0.2, 5);
  dlo = Math.max(0, dlo - dp); dhi += dp;

  const x = v => L + ((v + smax) / (2 * smax)) * iw;
  const y = v => T + ih - ((v - dlo) / (dhi - dlo)) * ih;

  let g = '';
  for (let k = 0; k <= 3; k++){
    const v = dlo + (dhi - dlo) * k / 3, yy = y(v);
    g += `<line class="gridline" x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}"/>`;
    g += `<text class="axis" x="${L-7}" y="${(yy+3.5).toFixed(1)}" text-anchor="end">${(v*U().dk).toFixed(0)}</text>`;
  }
  // 中线（侧旋 0°）
  g += `<line x1="${x(0).toFixed(1)}" y1="${T}" x2="${x(0).toFixed(1)}" y2="${T+ih}"
            stroke="#2a3a4d" stroke-width="1" stroke-dasharray="3 3"/>`;
  g += `<text class="axis" x="${x(0).toFixed(1)}" y="${H-8}" text-anchor="middle">0°</text>`;
  g += `<text class="axis" x="${L}" y="${H-8}">←左曲</text>`;
  g += `<text class="axis" x="${W-R}" y="${H-8}" text-anchor="end">右曲→</text>`;

  const n = data.length;
  const dots = data.map((r, i) => {
    const cx = x(r.m.spinAxis), cy = y(r.m.carry);
    const age = (i + 1) / n;              // 越新越亮
    const last = i === n - 1;
    const rad = last ? 6 : 3 + age * 2;
    const fill = last ? '#f0883e' : `rgba(88,166,255,${0.22 + age * 0.55})`;
    return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rad.toFixed(1)}" fill="${fill}"
              ${last?'stroke="#0a0e14" stroke-width="2"':''}>
              <title>#${r.seq} ${esc(clubOf(r.m))} ${r.m.spinAxis}° / ${(r.m.carry*U().dk).toFixed(1)}${U().dist}</title>
            </circle>`;
  }).join('');

  svg.innerHTML = g + dots;
}

/* ============ 历史表格 ============ */

    const hh = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0')
             + ':' + String(t.getSeconds()).padStart(2,'0');
    const cls = [r.seq === freshSeq ? 'fresh' : '', r.seq === aiSeq ? 'sel' : '']
      .filter(Boolean).join(' ');

    return `<tr data-seq="${r.seq}"${cls ? ` class="${cls}"` : ''}>
      <td class="idx">${r.seq}</td>
      <td class="tm">${hh}</td>

      <td class="num">${spd(m.ballSpeed)}</td>
      <td class="num">${spd(m.clubSpeed)}</td>
      <td class="num">${num(m.smash,2)}</td>
      <td class="num">${num(m.launch,1)}</td>
      <td class="num">${typeof m.spin==='number'?Math.round(m.spin):'—'}</td>
      <td class="num">${num(m.spinAxis,1)}</td>
      <td class="num">${dst(m.carry)}</td>
      <td class="num">${dst(m.total)}</td>

const SRC = {

  rules: ['rules', '规则诊断'],
  error: ['err',   '调用失败'],

function paintAI(){
  const box = $('aiBody'), hint = $('aiHint');
  const seq = aiSeq;
  const shot = shotBySeq(seq);
  const res = analyses[seq];

  // 球杆下拉框表示"用户想用的球杆"，默认 自动（空值）——不跟着结果显示，
  // 否则用户以为是自己选的，下次分析还会把它当手动覆盖发出去。

  if (!seq || !shot){
    hint.textContent = '每杆算完自动分析';
    box.innerHTML = `<div class="empty aiEmpty">
        <div>还没有可分析的击球</div>
        <div class="subline">打一杆，等 TrackMan 算完，分析会自动出现</div>
      </div>`;
    return;
  }

  if (!res){
    hint.textContent = `第 ${seq} 杆`;
    box.innerHTML = `<div class="aiWait"><div class="spin"></div>
        <div>正在分析第 ${seq} 杆…<small>${
          !aiInfo.use_ai ? '规则诊断中'
          : aiInfo.configured ? 'AI 正在读数据，通常 3~10 秒'
          : '未配置 AI Key，先用规则诊断'
        }</small></div></div>`;
    return;
  }

  const clubZh = res.club_label || res.club_zh || ($('aiClub').selectedOptions[0]?.textContent || '');
  const srcTag = res.club_guessed ? '（按球速推断）' : (res.club ? '（TPS 识别）' : '');
  hint.textContent = `第 ${seq} 杆${clubZh ? ' · ' + clubZh + srcTag : ''}`;

  const hl = (res.highlights || []).map(h =>
    `<div class="aiItem"><b>${esc(h.title)}</b><p>${esc(h.detail)}</p></div>`).join('');

  const iss = (res.issues || []).map(h => {
    const sv = h.severity || 'mid';
    return `<div class="aiItem"><b><span class="sev ${esc(sv)}">${SEV_ZH[sv] || '中'}</span>${esc(h.title)}</b>
      <p>${esc(h.detail)}</p>${h.evidence ? `<span class="ev">${esc(h.evidence)}</span>` : ''}</div>`;
  }).join('');

  const dr = (res.drills || []).map(d =>
    `<div class="aiDrill"><b>${esc(d.name)}</b>
      <div class="why">${esc(d.why)}</div>
      <div class="how">${esc(d.how)}</div></div>`).join('');

  const [cls, label] = SRC[res.source] || ['rules', res.source || ''];
  const foot = [];
  if (res.notice) foot.push(esc(res.notice));
  if (res.club_guessed) foot.push('球杆按球速推断，选错会影响判断');

  box.innerHTML = `
    ${res.summary ? `<div class="aiSummary">${esc(res.summary)}</div>` : ''}
    <div class="aiCols">
      <div class="aiCol find"><h3>发现了什么</h3>
        ${hl || '<div class="aiItem"><p>这一杆没有特别突出的亮点。</p></div>'}</div>
      <div class="aiCol prob"><h3>有什么问题</h3>
        ${iss || '<div class="aiItem"><p>没有发现明显问题，各项都在基准区间内。</p></div>'}</div>
      <div class="aiCol fix"><h3>如何改进</h3>
        ${dr || '<div class="aiItem"><p>暂无可执行的训练建议。</p></div>'}</div>
    </div>
    <div class="aiFoot">
      <span class="src ${cls}">${label}${res.model ? ' · ' + esc(res.model) : ''}</span>
      <span>${foot.join('　')}</span>
    </div>`;
}

function reanalyze(club){
  if (!aiSeq) return;
  delete analyses[aiSeq];
  paintAI();
  fetch('/api/analyze', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ seq: aiSeq, club: club || null }),
  }).catch(() => {});
}

/* ============ SSE ============ */
function connect(){
  const es = new EventSource('/events');

  es.addEventListener('hello', e => {
    const d = JSON.parse(e.data);
    shots = d.shots || [];
    analyses = d.analyses || {};
    aiSeq = shots.length ? shots[shots.length - 1].seq : 0;
    pendingShot = null;
    freshSeq = -1;
    normState = d.normalize || null;
    paintStatus(d.status);
    paintNorm();
    paintVer(d.build);
    refreshClubFilter();
    renderAll();
    paintAI();
  });

  es.addEventListener('pending', e => {
    // 设备正在算这一杆——不显示半成品，只提示进度
    pendingShot = JSON.parse(e.data);
    const last = shots.length ? shots[shots.length - 1].seq : 0;
    if (pendingShot.seq > last){
      $('latestHint').textContent = '计算中';
      $('latestBody').innerHTML = `<div class="aiWait"><div class="spin"></div>
          <div>第 ${pendingShot.seq} 杆正在计算…<small>TrackMan 算完距离与弹道后自动显示</small></div></div>`;
    }
  });

  es.addEventListener('shot', e => {
    const rec = JSON.parse(e.data);
    // 设备对同一杆会分多次推送，后端已按 Id 合并并等算完才发，
    // 这里按 seq 原地替换，避免同一杆堆成好几条。
    const i = shots.findIndex(x => x.seq === rec.seq);
    if (i >= 0) shots[i] = rec;
    else shots.push(rec);
    freshSeq = rec.seq;
    pendingShot = null;
    if (rec.seq !== aiSeq){
      aiSeq = rec.seq;               // 分析自动切到最新一杆
      resetClubPick();               // 新的一杆：球杆选择回到"自动"
      delete analyses[rec.seq];      // 这一杆的结果还没来
    }
    refreshClubFilter();
    paintKpis(); paintLatest(); paintTrend(); paintScatter(); paintTable(); paintAI();
  });

  es.addEventListener('analysis', e => {
    const d = JSON.parse(e.data);
    analyses[d.seq] = d;
    if (d.seq === aiSeq){ paintAI(); paintTable(); }
    else if (d.seq > aiSeq){ aiSeq = d.seq; paintAI(); paintTable(); }
  });

  es.addEventListener('norm', e => {
    normState = JSON.parse(e.data);
    paintNorm();
    paintLatest();
  });
  es.addEventListener('status', e => paintStatus(JSON.parse(e.data)));

  es.onerror = () => {
    paintStatus({tps:false, message:'看板服务断开，正在重连…'});
  };
}

/* ============ 交互 ============ */
$('unitBtn').textContent = U().tag;
$('unitBtn').onclick = () => {
  metric = !metric;
  localStorage.setItem('tm-unit', metric ? 'metric' : 'imperial');
  $('unitBtn').textContent = U().tag;
  renderAll();
};

$('clubFilter').onchange = e => {
  filterClub = e.target.value;
  renderAll();
};

/* ---- AI 交互 ---- */
$('aiClub').onchange = e => {
  clubOverride = e.target.value;          // 只在内存里记，不落 localStorage：不能带到下一杆
  reanalyze(e.target.value || null);
};
$('aiRedo').onclick = () => reanalyze($('aiClub').value || null);

// 点历史行 → 切换分析对象；没有分析结果的杆现场请求一次
$('tbody').onclick = e => {
  const tr = e.target.closest('tr[data-seq]');
  if (!tr) return;
  const seq = +tr.dataset.seq;
  if (seq !== aiSeq) resetClubPick();     // 换了一杆，之前的手动球杆不该跟过来
  aiSeq = seq;
  if (!analyses[aiSeq]){
    fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ seq: aiSeq, club: $('aiClub').value || null }),
    }).catch(() => {});
  }
  paintAI(); paintTable();
};

$('aiCfgBtn').onclick = () => {
  $('cfgUrl').value = aiInfo.base_url || '';
  $('cfgModel').value = aiInfo.model || '';
  $('cfgKey').value = '';
  $('cfgMsg').textContent = aiInfo.configured ? '已配置 Key' : '尚未配置 Key，当前只能用规则诊断';
  $('aiModal').hidden = false;
};
$('cfgCancel').onclick = () => { $('aiModal').hidden = true; };
$('aiModal').onclick = e => { if (e.target.id === 'aiModal') $('aiModal').hidden = true; };

async function saveAiCfg(){
  return fetch('/api/ai-config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      base_url: $('cfgUrl').value.trim(),
      model: $('cfgModel').value.trim(),
      api_key: $('cfgKey').value.trim(),
    }),
  }).then(r => r.json()).catch(() => ({ ok: false }));
}

$('cfgSave').onclick = async () => {
  $('cfgMsg').textContent = '保存中…';
  const r = await saveAiCfg();
  if (!r.ok){ $('cfgMsg').textContent = '保存失败'; return; }
  aiInfo = await fetch('/api/ai').then(x => x.json()).catch(() => aiInfo);
  $('aiModal').hidden = true;
  if (aiSeq) reanalyze($('aiClub').value);      // 换模型后立刻重跑这一杆
};

$('cfgTest').onclick = async () => {
  $('cfgMsg').textContent = '测试中…（最多 45 秒）';
  await saveAiCfg();                             // 先落盘，否则测的是旧配置
  const r = await fetch('/api/ai-test', { method: 'POST' })
    .then(x => x.json()).catch(() => ({ ok: false, error: '请求失败' }));
  $('cfgMsg').textContent = r.ok
    ? '连接正常 · ' + (r.model || '') + '　「' + r.summary + '」'
    : '失败：' + r.error;
};

fetch('/api/ai').then(r => r.json()).then(d => {
  aiInfo = d;
  aiClubs = d.clubs || [];
  fillAiClubs();
  if (clubOverride) $('aiClub').value = clubOverride;
  paintAI();
}).catch(() => {});

// 先按"未知"渲染，SSE 握手后立刻被真实状态覆盖
paintNorm();
fetch('/api/status').then(r => r.json()).then(d => {
  if (d.normalize){ normState = d.normalize; paintNorm(); }
  paintVer(d.build);
}).catch(() => {});

connect();
</script>
